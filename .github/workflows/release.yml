name: Create Obsidian Release

on:
  push:
    branches:
      - main
    paths:
      - manifest.json

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: obsidian-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Validate required files
        shell: bash
        run: |
          test -f main.js
          test -f manifest.json
          test -f styles.css
          test -f README.md
          test -f README_PL.md

      - name: Validate JavaScript and manifest
        shell: bash
        run: |
          node --check main.js
          node -e "JSON.parse(require('fs').readFileSync('manifest.json','utf8'))"

      - name: Validate semantic version
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version: $VERSION"
            exit 1
          fi

      - name: Verify README versions
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          grep -Fq "> Current plugin version: **${VERSION}**" README.md
          grep -Fq "> Aktualna wersja wtyczki: **${VERSION}**" README_PL.md

      - name: Check whether release exists
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $VERSION already exists."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate artifact attestations
        if: steps.existing.outputs.exists == 'false'
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            styles.css
            manifest.json

      - name: Create GitHub Release
        if: steps.existing.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          gh release create "$VERSION" \
            main.js \
            manifest.json \
            styles.css \
            --title "$VERSION" \
            --target "${{ github.sha }}" \
            --generate-notes \
            --latest \
            --fail-on-no-commits
